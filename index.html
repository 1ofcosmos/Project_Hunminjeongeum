<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#25251e"><title>프로젝트 훈민정음 · 백성의 목소리를 기록하다</title>
  <link rel="preload" href="assets/fonts/NanumBrushScript-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="assets/fonts/NanumMyeongjo-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="responsive.css" media="screen">
  <script src="responsive.js"></script>
</head>
<body>
  <div id="game-shell">
    <button id="game-logo" class="game-logo logo-hidden" data-action="home" aria-label="프로젝트 훈민정음 처음으로">
      <span class="logo-project">프로젝트</span>
      <span class="title-large" aria-hidden="true"></span>
      <span class="logo-subtitle">세종의 비밀 프로젝트</span>
    </button>
    <header class="topbar"><span id="chapter-label" class="chapter-label">이야기의 시작</span><nav aria-label="게임 메뉴"><button class="record-button" data-action="records">나의 기록 <span id="record-count">0</span></button><button data-action="settings">설정</button><button data-action="home">처음으로</button></nav></header>
    <main id="game" tabindex="-1"></main>
    <div id="toast" role="status" aria-live="polite"></div>
    <div id="advance-hint" aria-hidden="true" hidden>화면을 클릭하여 이야기를 이어 가세요 ›</div>
  </div>
  <dialog id="modal" aria-labelledby="modal-title"></dialog>
  <script src="data.js"></script><script src="npc-dialogues.js"></script><script src="app.js"></script>
</body>
</html>
